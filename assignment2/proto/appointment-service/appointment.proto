syntax = "proto3";
package appointment_service.proto;

option go_package = "github.com/CoffeeSi/golang2AITU/assignment2/appointment-service/proto;proto";

// AppointmentService provides RPC methods for managing appointments
service AppointmentService {
    // CreateAppointment creates a new appointment with the provided details
    rpc CreateAppointment(CreateAppointmentRequest) returns (AppointmentResponse);
    // GetAppointment retrieves an appointment by its ID
    rpc GetAppointment(GetAppointmentRequest) returns (AppointmentResponse);
    // ListAppointments retrieves a list of all appointments
    rpc ListAppointments(ListAppointmentsRequest) returns (ListAppointmentsResponse);
    // UpdateAppointmentStatus updates the status of an appointment
    rpc UpdateAppointmentStatus(UpdateStatusRequest) returns (AppointmentResponse);
}

message CreateAppointmentRequest {
    string title = 1;
    string description = 2;
    string doctor_id = 3;
}
message GetAppointmentRequest { string id = 1; }
message ListAppointmentsRequest {}
message UpdateStatusRequest { string id = 1; string status = 2; }

message AppointmentResponse {
    string id = 1;
    string title = 2;
    string description = 3;
    string doctor_id = 4;
    string status = 5;
    string created_at = 6;
    string updated_at = 7;
}

message ListAppointmentsResponse { repeated AppointmentResponse appointments = 1; }